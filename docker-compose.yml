services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiter_bot}
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter}
    ports:
      # For local development only; the API reaches the database inside the Compose network.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        # WITH_MODELS=true docker compose up --build adds the optional model stage.
        WITH_MODELS: ${WITH_MODELS:-false}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD:-recruiter}@db:5432/${POSTGRES_DB:-recruiter_bot}
      # "off" keeps word linking to the deterministic rules even when the models are installed.
      MODEL_LINKING: ${MODEL_LINKING:-auto}
      # The address printed at startup for you to open.
      PUBLIC_URL: http://127.0.0.1:${API_PORT:-8000}
    ports:
      # Set API_PORT if 8000 is already in use on this machine.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        # Waits until Postgres answers, not just until its container exists.
        condition: service_healthy

volumes:
  pgdata:
